services:
  - type: web
    name: snapform-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm -w packages/shared run build && npm -w apps/api run build
    startCommand: npx prisma migrate deploy && node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: "noreply@snapform.dev"
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: LOG_LEVEL
        value: "info"
      - key: CORS_ORIGINS
        value: "https://snapform-api.onrender.com"
